name: Track upstream candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-candidates
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report drift and prepare reviewed-input candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/track.py >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/test_build.py
          python3 scripts/update.py
          if git diff --quiet -- deps.lock.json; then exit 0; fi
          python3 scripts/build.py
          node --test scripts/test_managed_entry.mjs
          git fetch origin automation/upstream-candidate || true
          git checkout -B automation/upstream-candidate
          git config user.name 'myfl update tracker'
          git config user.email 'actions@users.noreply.github.com'
          git add deps.lock.json
          git commit -m 'Prepare pinned upstream candidate'
          git push --force-with-lease origin automation/upstream-candidate
          if ! gh pr list --head automation/upstream-candidate --json number --jq '.[].number' | grep -q .; then
            gh pr create --base main --head automation/upstream-candidate --title 'Review upstream PS5 candidate' --body 'Pinned upstream changes with verified asset digests. Review release notes, source notices and dependency order, then build and test both 13.60 routes. This candidate is not promoted or deployed automatically.'
          fi
