pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format aggregate escape=json '{"time":"$time_iso8601","path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
  access_log /dev/stdout aggregate;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 20s;
  keepalive_timeout 10s;
  server_tokens off;
  sendfile on;
  # Caddy overwrites this header with the socket peer; only loopback reaches this origin.
  limit_req_zone $http_x_myfl_client zone=per_client:1m rate=20r/s;
  limit_req_zone $server_name zone=total:1m rate=200r/s;
  limit_conn_zone $http_x_myfl_client zone=connections:1m;
  server {
    listen 8080;
    root /srv;
    autoindex off;
    limit_req zone=per_client burst=80 nodelay;
    limit_req zone=total burst=200 nodelay;
    limit_req_status 429;
    limit_conn connections 16;
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # Preserve relative Relapse asset URLs beneath the source-confirmed User's Guide path.
    rewrite ^/document/[^/]+/ps5/(.*)$ /relapse/$1 last;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location = /relapse/serve.py { deny all; }
    location = /healthz { access_log off; default_type text/plain; return 200 'myfl-relapse\n'; }
  }
}
