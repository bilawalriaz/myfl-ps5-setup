name: myfl-ps5
services:
  web:
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    user: '101:101'
    entrypoint: [nginx]
    command: ['-c', '/etc/nginx/myfl.conf', '-g', 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: 'on-failure:3'
    ports:
      - '127.0.0.1:${MYFL_HTTP_PORT:?Set an unused origin port}:8080'
    volumes:
      - ../dist:/srv:ro
      - ./nginx.conf:/etc/nginx/myfl.conf:ro
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [isolated]
    logging: {driver: local, options: {max-size: '5m', max-file: '3'}}
  dns:
    image: myfl-coredns:1.13.1-nocap
    build:
      context: .
      dockerfile: Dockerfile.dns
    user: '65532:65532'
    command: ['-conf', '/etc/coredns/Corefile']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: 'on-failure:3'
    ports:
      - '${MYFL_BIND_IP:?Set the verified primary interface address}:${MYFL_DNS_PORT:?Set the DNS listener port}:1053/udp'
      - '${MYFL_BIND_IP:?Set the verified primary interface address}:${MYFL_DNS_PORT:?Set the DNS listener port}:1053/tcp'
    volumes:
      - ../.cache/dns:/etc/coredns:ro
    expose: ['9153']
    networks: [isolated]
    logging: {driver: local, options: {max-size: '5m', max-file: '3'}}
networks:
  isolated:
    # Bridge publication is needed; scoped firewall rules block all new egress.
    internal: false
    driver_opts:
      com.docker.network.bridge.name: br-myflps5
